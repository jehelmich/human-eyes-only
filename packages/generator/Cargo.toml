[package]
name = "heo-generator"
version = "0.0.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Text to randomised SVG carrier generator for HEO."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
