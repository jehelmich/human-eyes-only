name: CI

on:
  push:
    branches: [main, "release/**"]
    tags:
      - "v*"
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Repository hygiene
        run: pnpm check:artifacts
      - run: pnpm typecheck
      - run: pnpm test

      # The compatibility gate over the whole corpus, against both the identity
      # transform and the engine. Identity scoring below 100% is a harness bug
      # and the run says so; the engine failing a gate is a rejected change.
      - name: Compatibility gate (identity)
        run: pnpm compat

      - name: Compatibility gate (engine)
        run: pnpm compat -- --transform heo

  # C3 and C4 need Chromium, so they are a separate job: the fast one above
  # stays under the every-push budget and this one runs alongside it rather than
  # in front of it (ROADMAP.md, cadence).
  visual:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @human-eyes-only/benchmark exec playwright install chromium

      # The carrier alignment check needs the generator, which is a cargo
      # artifact and is deliberately not committed.
      # Without it the check reports itself skipped rather than passing, so the
      # build belongs here: a gate that is not run is not a gate. The runner
      # image ships a Rust toolchain; only the target is missing.
      - run: rustup target add wasm32-unknown-unknown
      - run: pnpm --filter @human-eyes-only/generator build

      - name: Visual gate (identity)
        run: pnpm compat -- --browser

      - name: Visual gate (engine)
        run: pnpm compat -- --transform heo --browser

  release:
    runs-on: ubuntu-latest
    needs: [verify, visual]
    permissions:
      contents: read
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_AUTO_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "${GITHUB_REF_NAME}"
      - name: Check tag is on an allowed release branch
        run: |
          git fetch origin main '+refs/heads/release/*:refs/remotes/origin/release/*'

          allowed=false
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            allowed=true
          fi

          while read -r ref; do
            if git merge-base --is-ancestor "${GITHUB_SHA}" "${ref}"; then
              allowed=true
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/release)

          if [ "${allowed}" != "true" ]; then
            echo "::error::Release tags must point at a commit reachable from main or release/*."
            exit 1
          fi
      - run: pnpm build
      - run: rustup target add wasm32-unknown-unknown
      - name: Pack release tarballs
        run: |
          mkdir -p .release
          pnpm --filter @human-eyes-only/core pack --pack-destination .release
          pnpm --filter @human-eyes-only/generator pack --pack-destination .release
          pnpm --filter @human-eyes-only/middleware pack --pack-destination .release
      - run: npm publish .release/human-eyes-only-core-${GITHUB_REF_NAME#v}.tgz --access public --tag alpha
      - run: npm publish .release/human-eyes-only-generator-${GITHUB_REF_NAME#v}.tgz --access public --tag alpha
      - run: npm publish .release/human-eyes-only-middleware-${GITHUB_REF_NAME#v}.tgz --access public --tag alpha
